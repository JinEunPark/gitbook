<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif"><rect width="880" height="420" fill="#fcfcfb"/><text x="36" y="50" font-size="13" font-weight="700" fill="#2a78d6">문제 해결 사례 #01 · rekit 성능 개선</text><text x="34" y="122" font-size="62" font-weight="800" letter-spacing="-1"><tspan fill="#a3a29c">18.2초</tspan><tspan fill="#8a8984" font-weight="400" dx="12">→</tspan><tspan fill="#2a78d6" dx="12">1.8초</tspan></text><rect x="694" y="78" width="150" height="48" rx="10" fill="#dfeafb"/><text x="769" y="111" font-size="24" font-weight="800" fill="#104281" text-anchor="middle">10배 빠르게</text><text x="36" y="160" font-size="15" fill="#52514e">모바일 4G에서 상품 목록 사진이 전부 뜨는 시간 · 원인 측정부터 운영 반영까지 하루</text><text x="98" y="200" font-size="13" fill="#52514e" text-anchor="end">개선 전</text><path d="M110 186h616.0a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4h-616.0z" fill="#a3a29c"/><text x="740" y="200" font-size="13" font-weight="700" fill="#0b0b0b">18.2초</text><text x="98" y="228" font-size="13" fill="#52514e" text-anchor="end">개선 후</text><path d="M110 214h57.6a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4h-57.6z" fill="#2a78d6"/><text x="181.6254805052169" y="228" font-size="13" font-weight="700" fill="#0b0b0b">1.8초</text><rect x="36" y="256" width="193" height="106" rx="12" fill="#f3f2ee"/><text x="52" y="300" font-size="30" font-weight="800" fill="#0b0b0b">-92<tspan font-size="16" font-weight="700" dx="2">%</tspan></text><text x="52" y="326" font-size="12.5" fill="#52514e">목록 이미지 전송량</text><text x="52" y="345" font-size="12.5" fill="#52514e">19.4MB → 1.5MB</text><rect x="241" y="256" width="193" height="106" rx="12" fill="#f3f2ee"/><text x="257" y="300" font-size="30" font-weight="800" fill="#0b0b0b">1.4<tspan font-size="16" font-weight="700" dx="2">초</tspan></text><text x="257" y="326" font-size="12.5" fill="#52514e">첫 사진이 보이기까지</text><text x="257" y="345" font-size="12.5" fill="#52514e">12.4초에서 (Fast 4G)</text><rect x="446" y="256" width="193" height="106" rx="12" fill="#f3f2ee"/><text x="462" y="300" font-size="30" font-weight="800" fill="#0b0b0b">9.7<tspan font-size="16" font-weight="700" dx="2">초</tspan></text><text x="462" y="326" font-size="12.5" fill="#52514e">느린 회선 목록 완성</text><text x="462" y="345" font-size="12.5" fill="#52514e">102.5초에서 (Slow 4G)</text><rect x="651" y="256" width="193" height="106" rx="12" fill="#f3f2ee"/><text x="667" y="300" font-size="30" font-weight="800" fill="#0b0b0b">0<tspan font-size="16" font-weight="700" dx="2">건</tspan></text><text x="667" y="326" font-size="12.5" fill="#52514e">DB 마이그레이션 · API 변경</text><text x="667" y="345" font-size="12.5" fill="#52514e">기존 URL 그대로 적용</text><text x="36" y="394" font-size="12" fill="#8a8984">운영 서비스 실측 · 모바일 화면, 캐시 끔, 3회 측정 중앙값</text></svg>